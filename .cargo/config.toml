# x86-64-v2 (SSE4.2/POPCNT; every x86-64 CPU since ~2009, required by
# Windows 11) lets floor/ceil/rounding compile to single instructions instead
# of software routines -- a large win for Lua's `%`, math.floor, etc.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.i686-pc-windows-gnu]
linker = "i686-w64-mingw32-gcc"

# Every Intel Mac that runs macOS 11+ has SSE4.2 (x86-64-v2).
[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v2"]
